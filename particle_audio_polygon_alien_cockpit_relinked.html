<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGPU Particle-Life // Alien Cockpit</title>
  <style>
    body   { margin:0; background:#000; overflow:hidden; position:relative;
             color:#ddd; font-family:system-ui; }
    canvas { display:block; }
    #overlay   { position:absolute; top:0; left:0; pointer-events:none; }
    #setupMask { position:fixed; inset:0; background:#000d;
                 display:flex; align-items:center; justify-content:center; }
    :root {
      --dos-bg:#020502; --dos-bg2:#061406; --dos-green:#7cff9b;
      --dos-green-dim:#2fc45a; --dos-cyan:#6dfcff; --dos-amber:#ffd866;
      --dos-red:#ff4d7d; --dos-grid:rgba(124,255,155,.22);
    }
    body   { font-family:"IBM VGA 8x16", "Fira Code", "Cascadia Mono", "Courier New", monospace; }
    .lil-gui.root, .lil-gui {
      --background-color:rgba(0,9,2,.91); --text-color:var(--dos-green);
      --title-background-color:#001b07; --title-text-color:var(--dos-cyan);
      --widget-color:#021f0b; --hover-color:#073516; --focus-color:#0b4f23;
      --number-color:var(--dos-amber); --string-color:var(--dos-cyan);
      --font-family:"IBM VGA 8x16", "Fira Code", "Cascadia Mono", "Courier New", monospace;
      text-shadow:0 0 8px rgba(124,255,155,.35);
    }
    .force-panel {
      position:fixed; left:16px; bottom:16px; z-index:900;
      width:min(690px, calc(100vw - 32px)); max-height:78vh; overflow:auto;
      background:
        radial-gradient(circle at 16% 10%, rgba(109,252,255,.12), transparent 32%),
        linear-gradient(180deg, rgba(0,18,5,.97), rgba(0,6,2,.96));
      border:1px solid var(--dos-green); border-radius:0;
      box-shadow:0 0 0 1px rgba(0,0,0,.9) inset, 0 0 28px rgba(47,196,90,.30), 0 18px 60px rgba(0,0,0,.65);
      padding:12px; user-select:none; color:var(--dos-green);
      font:12px/1.35 "IBM VGA 8x16", "Fira Code", "Cascadia Mono", "Courier New", monospace;
      text-shadow:0 0 8px rgba(124,255,155,.38);
    }
    .force-panel::before {
      content:""; position:sticky; display:block; top:-12px; height:0; z-index:3; pointer-events:none;
      box-shadow:0 0 0 9999px transparent;
    }
    .force-panel::after {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0, rgba(255,255,255,.035) 1px, transparent 1px, transparent 4px);
      mix-blend-mode:screen; opacity:.23;
    }
    .force-titlebar {
      display:flex; justify-content:space-between; align-items:center; gap:12px; cursor:move;
      margin:-4px -4px 10px; padding:6px 8px; border:1px solid var(--dos-grid);
      background:linear-gradient(90deg, rgba(0,255,102,.14), rgba(0,255,255,.07));
      color:var(--dos-cyan); letter-spacing:.08em; text-transform:uppercase;
    }
    .force-titlebar strong { font-size:13px; font-weight:800; }
    .force-titlebar button, .force-panel button {
      background:#031407; color:var(--dos-green); border:1px solid var(--dos-green-dim);
      border-radius:0; padding:5px 8px; cursor:pointer; font:inherit; text-transform:uppercase;
      box-shadow:0 0 0 1px rgba(0,0,0,.85) inset;
    }
    .force-titlebar button:hover, .force-panel button:hover { background:#073516; color:#d7ffe0; border-color:var(--dos-cyan); }
    .force-panel button.active {
      background:var(--dos-green); color:#001904; text-shadow:none; border-color:#d8ffe1;
      box-shadow:0 0 16px rgba(124,255,155,.55);
    }
    .force-panel button.danger.active { background:var(--dos-red); color:#190007; border-color:#ffc4d2; box-shadow:0 0 16px rgba(255,77,125,.55); }
    .force-panel button.warn.active { background:var(--dos-amber); color:#181000; border-color:#fff2b8; box-shadow:0 0 16px rgba(255,216,102,.55); }
    .force-help {
      border:1px dashed var(--dos-grid); background:rgba(0,255,102,.055); padding:7px 8px; margin:0 0 10px;
      color:#baffc8;
    }
    .force-status {
      display:grid; gap:3px; border:1px solid rgba(109,252,255,.45); background:rgba(0,20,16,.62);
      padding:7px 8px; margin-bottom:10px; color:var(--dos-cyan); white-space:normal;
    }
    .force-status b { color:var(--dos-amber); font-weight:800; }
    .force-toolbar { display:grid; grid-template-columns:1.15fr 1fr; gap:8px 10px; margin-bottom:10px; }
    .force-toolbar label { display:grid; gap:4px; color:#baffc8; }
    .force-toolbar label.full { grid-column:1 / -1; }
    .force-mode-row { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:6px; }
    .force-range-row { display:grid; grid-template-columns:1fr 82px; gap:6px; align-items:center; }
    .force-toolbar select, .force-toolbar input[type=number] {
      width:100%; box-sizing:border-box; background:#000; color:var(--dos-amber);
      border:1px solid var(--dos-green-dim); border-radius:0; padding:5px 6px; font:inherit;
      box-shadow:0 0 0 1px rgba(0,0,0,.85) inset;
    }
    .force-toolbar input[type=range] { width:100%; accent-color:var(--dos-green); }
    .force-toolbar output { color:var(--dos-amber); justify-self:end; }
    .force-checks { display:flex; flex-wrap:wrap; gap:12px; margin:4px 0 10px; color:#baffc8; }
    .force-checks input { accent-color:var(--dos-green); }
    .force-grid-wrap { overflow:auto; padding-bottom:4px; border:1px solid var(--dos-grid); background:rgba(0,0,0,.42); }
    .force-grid { display:grid; gap:3px; align-items:stretch; min-width:max-content; padding:7px; }
    .force-label {
      display:flex; align-items:center; justify-content:center; min-width:48px; min-height:34px;
      color:var(--dos-cyan); font-size:11px; border:1px solid rgba(109,252,255,.28); background:rgba(0,255,255,.045);
      text-transform:uppercase;
    }
    .force-corner { background:rgba(255,216,102,.06); color:var(--dos-amber); }
    .force-cell {
      width:72px; height:48px; border-radius:0; border:1px solid rgba(124,255,155,.34);
      display:grid; grid-template-rows:1fr auto; align-items:center; justify-items:center; position:relative; overflow:hidden;
      cursor:crosshair; color:#f0fff2; font-weight:800; font-size:12px;
      text-shadow:0 0 8px rgba(0,0,0,.85), 0 0 8px currentColor;
      transition:transform .05s linear, border-color .05s linear, filter .05s linear;
    }
    .force-cell:hover { transform:translateY(-1px); filter:brightness(1.22); border-color:var(--dos-amber); }
    .force-cell.selected { outline:2px solid var(--dos-amber); outline-offset:1px; box-shadow:0 0 18px rgba(255,216,102,.35); }
    .force-cell.positive { color:#d7fff0; }
    .force-cell.negative { color:#ffe2eb; }
    .force-cell.zero { color:#baffc8; }
    .force-cell::after {
      content:""; position:absolute; inset:auto 5px 4px 5px; height:4px; border:1px solid rgba(255,255,255,.2);
      background:linear-gradient(90deg, var(--dos-amber), var(--dos-cyan)); transform-origin:left center; transform:scaleX(var(--radius-frac,.35));
      box-shadow:0 0 8px rgba(255,216,102,.45);
    }
    .force-cell-strength { align-self:end; padding-top:5px; }
    .force-cell-radius { align-self:start; margin-top:-1px; margin-bottom:7px; font-size:10px; color:var(--dos-amber); opacity:.96; }
    .force-cell-mini { font-size:10px; color:#c5ffd0; margin-bottom:8px; }
    .force-legend {
      display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-top:8px; color:#baffc8; font-size:11px;
    }
    .force-legend .chip { display:inline-flex; align-items:center; gap:5px; }
    .force-legend .swatch { width:24px; height:9px; border:1px solid rgba(255,255,255,.25); display:inline-block; }


    /* ───────────── Alien cockpit / mobile-leaning polish ───────────── */
    html, body { width:100%; height:100%; overscroll-behavior:none; }
    #sim, #overlay {
      position:fixed; inset:0; width:100vw; height:100dvh;
      max-width:none; max-height:none; touch-action:none;
    }
    #sim { cursor:crosshair; background:#000; }
    .alien-cockpit, .alien-morph, .alien-toast {
      font-family:"IBM VGA 8x16", "Fira Code", "Cascadia Mono", "Courier New", monospace;
      color:#baffc8; text-shadow:0 0 9px rgba(124,255,155,.42);
      letter-spacing:.02em; user-select:none;
    }
    .alien-cockpit {
      position:fixed; top:14px; left:14px; z-index:820; width:min(392px, calc(100vw - 28px));
      background:
        radial-gradient(circle at 100% 0%, rgba(109,252,255,.16), transparent 28%),
        radial-gradient(circle at 0% 100%, rgba(255,216,102,.10), transparent 30%),
        linear-gradient(180deg, rgba(0,18,7,.88), rgba(0,5,2,.84));
      border:1px solid rgba(124,255,155,.72); box-shadow:0 0 0 1px rgba(0,0,0,.92) inset, 0 0 34px rgba(47,196,90,.24);
      backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    }
    .alien-cockpit::after, .alien-morph::after {
      content:""; position:absolute; inset:0; pointer-events:none;
      background:repeating-linear-gradient(180deg, rgba(255,255,255,.035) 0, rgba(255,255,255,.035) 1px, transparent 1px, transparent 5px);
      opacity:.22; mix-blend-mode:screen;
    }
    .alien-title {
      display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:8px 10px; color:var(--dos-cyan); text-transform:uppercase; border-bottom:1px solid rgba(109,252,255,.34);
      background:linear-gradient(90deg, rgba(0,255,102,.13), rgba(0,255,255,.06));
    }
    .alien-title strong { font-size:13px; }
    .alien-title .glyph { color:var(--dos-amber); }
    .alien-cockpit button, .alien-morph button {
      background:#021207; color:var(--dos-green); border:1px solid rgba(124,255,155,.48); border-radius:0;
      padding:6px 8px; font:inherit; cursor:pointer; text-transform:uppercase;
    }
    .alien-cockpit button:hover, .alien-morph button:hover { border-color:var(--dos-cyan); color:#eaffef; background:#073516; }
    .alien-cockpit button.active, .alien-morph button.active { background:var(--dos-green); color:#001904; text-shadow:none; border-color:#d8ffe1; }
    .alien-body { padding:9px 10px 10px; display:grid; gap:9px; }
    .alien-readouts { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; }
    .alien-readout { border:1px solid rgba(124,255,155,.22); background:rgba(0,0,0,.32); padding:6px; min-width:0; }
    .alien-readout span { display:block; color:rgba(186,255,200,.72); font-size:10px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .alien-readout b { display:block; color:var(--dos-amber); font-size:14px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .alien-relation {
      display:grid; grid-template-columns:1fr auto 1fr; gap:6px; align-items:center;
      border:1px solid rgba(109,252,255,.38); background:rgba(0,20,16,.42); padding:7px;
    }
    .alien-relation .kind-pill { text-align:center; border:1px solid rgba(124,255,155,.32); background:rgba(0,0,0,.35); padding:5px 6px; color:#effff2; }
    .alien-relation .arrow { color:var(--dos-amber); text-align:center; font-weight:800; }
    .alien-commands { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; }
    .alien-guidance { min-height:34px; border:1px dashed rgba(124,255,155,.32); background:rgba(0,255,102,.045); padding:7px 8px; color:#d8ffdf; }
    .alien-guidance b { color:var(--dos-cyan); }
    .alien-morph {
      position:fixed; right:14px; bottom:14px; z-index:830; width:min(300px, calc(100vw - 28px));
      background:linear-gradient(180deg, rgba(0,14,8,.90), rgba(0,5,6,.86));
      border:1px solid rgba(109,252,255,.62); box-shadow:0 0 28px rgba(109,252,255,.22), 0 0 0 1px rgba(0,0,0,.92) inset;
      backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    }
    .alien-morph-head { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 9px; border-bottom:1px solid rgba(109,252,255,.28); color:var(--dos-cyan); text-transform:uppercase; }
    .alien-pad-wrap { padding:10px; }
    .alien-pad {
      position:relative; height:190px; border:1px solid rgba(124,255,155,.45);
      background:
        linear-gradient(90deg, rgba(124,255,155,.12), transparent 45%, rgba(255,77,125,.12)),
        linear-gradient(0deg, rgba(109,252,255,.08), transparent 50%, rgba(255,216,102,.14)),
        repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0, rgba(255,255,255,.05) 1px, transparent 1px, transparent 24px),
        repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0, rgba(255,255,255,.045) 1px, transparent 1px, transparent 24px),
        rgba(0,0,0,.42);
      touch-action:none; cursor:crosshair; overflow:hidden;
    }
    .alien-pad::before, .alien-pad::after { content:""; position:absolute; background:rgba(109,252,255,.34); pointer-events:none; }
    .alien-pad::before { left:50%; top:0; bottom:0; width:1px; }
    .alien-pad::after { top:50%; left:0; right:0; height:1px; }
    .alien-knob {
      position:absolute; left:50%; top:50%; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%;
      border:2px solid var(--dos-amber); box-shadow:0 0 16px rgba(255,216,102,.75), 0 0 0 7px rgba(255,216,102,.10);
      background:rgba(255,216,102,.18); pointer-events:none;
    }
    .alien-axis { position:absolute; font-size:10px; color:rgba(234,255,240,.76); text-transform:uppercase; pointer-events:none; }
    .alien-axis.left { left:7px; top:50%; transform:translateY(-50%); }
    .alien-axis.right { right:7px; top:50%; transform:translateY(-50%); }
    .alien-axis.top { top:6px; left:50%; transform:translateX(-50%); }
    .alien-axis.bottom { bottom:6px; left:50%; transform:translateX(-50%); }
    .alien-morph-readout { display:flex; justify-content:space-between; gap:8px; margin-top:8px; color:#baffc8; font-size:11px; }
    .alien-toast {
      position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:910; max-width:min(620px, calc(100vw - 28px));
      padding:9px 12px; border:1px solid rgba(255,216,102,.65); background:rgba(16,10,0,.82); color:#fff2b8;
      box-shadow:0 0 24px rgba(255,216,102,.22); opacity:0; pointer-events:none; transition:opacity .18s linear;
    }
    .alien-toast.visible { opacity:1; }
    .alien-hidden { display:none !important; }
    .alien-collapsed .alien-body { display:none; }
    @media (max-width: 760px), (pointer: coarse) {
      .lil-gui.root { max-height:42dvh; overflow:auto; right:8px !important; top:8px !important; width:min(320px, calc(100vw - 16px)) !important; font-size:12px; }
      .alien-cockpit { top:8px; left:8px; width:calc(100vw - 16px); }
      .alien-readouts { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .alien-commands { grid-template-columns:repeat(3, minmax(0,1fr)); }
      .alien-morph { left:8px; right:8px; bottom:8px; width:auto; }
      .alien-pad { height:145px; }
      .force-panel { left:8px !important; right:8px !important; bottom:172px !important; width:auto !important; max-height:54dvh; }
      .force-toolbar { grid-template-columns:1fr; }
      .force-mode-row { grid-template-columns:repeat(2, minmax(0,1fr)); }
      .force-cell { width:64px; height:46px; }
    }

  </style>
</head>
<body>
  <!-- hidden until simulation starts -->
  <canvas id="sim"     width="1024" height="512" style="display:none"></canvas>
  <canvas id="overlay" width="1024" height="512" style="display:none"></canvas>

  <!-- setup screen -->
  <div id="setupMask"></div>

  <script type="module">
  import GUI from 'https://cdn.jsdelivr.net/npm/lil-gui@0.19.1/dist/lil-gui.esm.min.js';

  /**********************************************************************
   * SECTION 0 ─ PRE-SIMULATION SETUP (+ SAVE / IMPORT / PASTE)
   *********************************************************************/
  const mask   = document.getElementById('setupMask');
  const stored = localStorage.getItem('particleSimSave');
  const isCoarsePointer = window.matchMedia?.('(pointer: coarse)').matches ?? false;
  const setupProfiles = { Pocket:4096, Phone:16384, Tablet:32768, Desktop:65536 };

  /* ---------- helpers -------------------------- */
  const tryStart = txt => {
    try {
      const cfg = JSON.parse(txt);
      Object.keys(cfg).forEach(k => k.startsWith('_') && delete cfg[k]);
      startSim(cfg);
    } catch (e) {
      alert('❌  Could not parse JSON:\n' + e.message);
      console.error(e);
    }
  };
  async function importFile () {
    const el = Object.assign(document.createElement('input'),
                              { type:'file', accept:'application/json' });
    el.click();
    el.onchange = () => el.files?.[0]?.text().then(tryStart);
  }
  function pasteJSON () {
    const txt = prompt('Paste your save JSON here:');
    if (txt) tryStart(txt);
  }

  /* ---------- setup state & GUI --------------- */
  const MAX_BEACONS=16
  const GRID_FLAG = 6;
  const WAVE_FLAG = 7;
  const WAVE_LEN  = 256;
  const setup = {
    profile       : isCoarsePointer ? 'Phone' : 'Desktop',
    particleCount : isCoarsePointer ? setupProfiles.Phone : setupProfiles.Desktop,
    kindCount     : 2,
    preset        : 'Random',             // Random | Sand
    boundarySides : 64,                   // 128 is visually close to a circle
    loadSaved  : () => stored && startSim(JSON.parse(stored)),
    importFile, pasteJSON,
    launch     : () => startSim({
                   particleCount : setup.particleCount,
                   kindCount     : setup.kindCount,
                   preset        : setup.preset,
                   boundary      : {
                     sides    : setup.boundarySides,
                     rotation : -Math.PI / 2,
                     bounce   : 1.0
                   }
                 })
  };
  const preGUI = new GUI({ width:300, container:mask }).title('Simulation Setup');
  let setupParticleCtrl = null;
  preGUI.add(setup,'profile',Object.keys(setupProfiles)).name('Performance profile').onChange(v => {
    setup.particleCount = setupProfiles[v] ?? setup.particleCount;
    setupParticleCtrl?.updateDisplay();
  });
  setupParticleCtrl = preGUI.add(setup,'particleCount',1024,1<<16,1024).name('# Particles');
  preGUI.add(setup,'kindCount',1,6,1).name('# Kinds');
  preGUI.add(setup,'preset',['Random','Sand']).name('Preset');
  preGUI.add(setup,'boundarySides',3,128,1).name('Boundary sides');
  if (stored) preGUI.add(setup,'loadSaved').name('📂 Load Previous');
  preGUI.add(setup,'importFile').name('📁 Import File');
  preGUI.add(setup,'pasteJSON').name('📝 Paste JSON');
  preGUI.add(setup,'launch').name('🚀 Launch');

  /**********************************************************************
   * SECTION 1 ─ MAIN ENTRY POINT (startSim)
   *********************************************************************/
  async function startSim (cfg){
    /* un-mask canvases & destroy setup */
    preGUI.destroy(); mask.remove();
    const canvas  = document.getElementById('sim');
    const oCanvas = document.getElementById('overlay');
    canvas.style.display = oCanvas.style.display = 'block';
    const octx    = oCanvas.getContext('2d');

    /* basic config normalisation */
    const particleCount = cfg.particleCount ?? 65_536;
    const kindCount     = cfg.kindCount     ?? 2;
    const preset        = cfg.preset        ?? 'Random';
    const domain        = { w:1024, h:512 };
    const simParams     = {
      dt:0.01, friction:0.995, C:100,
      forceScale:1.0, radiusScale:1.0, beaconScale:1.0, speedLimit:0.0,
      ...(cfg.simParams ?? {})
    };
    const renderParams  = {
      trails:false, trailFade:0.945, trailParticleGain:0.42,
      pointBrightness:1.0, trailOutputGain:1.15,
      glow:false, glowBlur:0.35, glowBrightness:1.18, glowSaturation:1.25,
      ...(cfg.renderParams ?? {})
    };
    const boundary      = {
      sides    : Math.max(3, Math.min(128, Math.round(cfg.boundary?.sides ?? cfg.boundarySides ?? 64))),
      radius   : cfg.boundary?.radius   ?? Math.min(domain.w, domain.h) * 0.48,
      rotation : cfg.boundary?.rotation ?? -Math.PI / 2,
      bounce   : cfg.boundary?.bounce   ?? 1.0,
      keepBeaconsInside : cfg.boundary?.keepBeaconsInside ?? true
    };
    const alienState = {
      hud:true, morphPad:true, guidance:true, relationshipSpotlight:true, beaconAuras:true,
      labVisible:true, paused:false, morphX:0.5, morphY:0.5, morphVisuals:true, morphIntensity:1.0,
      ...(cfg.alienUI ?? {})
    };
    const selectedRelation = { a:0, b:0, active:false };
    const hoverRelation = { a:0, b:0, active:false };
    function setHoverRelation(a,b){
      hoverRelation.a = a;
      hoverRelation.b = b;
      hoverRelation.active = true;
      updateAlienHud();
    }
    function clearHoverRelation(){
      if (!hoverRelation.active) return;
      hoverRelation.active = false;
      updateAlienHud();
      try { updateHeatmapReadouts?.(); } catch {}
    }
    let updateAlienHud = () => {};
    let syncAlienPanels = () => {};
    function pointInsideBoundary(x, y) {
      const n  = Math.max(3, Math.min(128, Math.round(boundary.sides)));
      const cx = domain.w * 0.5, cy = domain.h * 0.5, R = boundary.radius;
      for (let k = 0; k < n; ++k) {
        const a0 = boundary.rotation + Math.PI * 2 * k / n;
        const a1 = boundary.rotation + Math.PI * 2 * (k + 1) / n;
        const ax = cx + R * Math.cos(a0), ay = cy + R * Math.sin(a0);
        const bx = cx + R * Math.cos(a1), by = cy + R * Math.sin(a1);
        const ex = bx - ax, ey = by - ay;
        const len = Math.hypot(ex, ey) || 1;
        const nx = ey / len, ny = -ex / len;
        if ((x - ax) * nx + (y - ay) * ny > 0) return false;
      }
      return true;
    }
    function clampPointToBoundary(x, y, pad = 4) {
      let px = Number.isFinite(x) ? x : domain.w * 0.5;
      let py = Number.isFinite(y) ? y : domain.h * 0.5;
      const n  = Math.max(3, Math.min(128, Math.round(boundary.sides)));
      const cx = domain.w * 0.5, cy = domain.h * 0.5;
      const R  = Math.max(8, boundary.radius);
      for (let pass = 0; pass < 4; ++pass) {
        for (let k = 0; k < n; ++k) {
          const a0 = boundary.rotation + Math.PI * 2 * k / n;

      waveArr.set(waveArr.subarray(idx * WAVE_LEN, (idx + 1) * WAVE_LEN), beaconCount * WAVE_LEN);
      return ++beaconCount, uploadWaves(), uploadBeacons(), beaconCount-1;
    }
    function deleteBeacon(idx){
      if(idx<0||idx>=beaconCount) return;
      stopLiveForBeacon(idx);
      if(idx<beaconCount-1){
        const last = beaconCount - 1;
        beaconArr.set(beaconArr.subarray(beaconOffset(last),
                                         beaconOffset(last + 1)),
                      beaconOffset(idx));
        waveArr.set(waveArr.subarray(last * WAVE_LEN, (last + 1) * WAVE_LEN), idx * WAVE_LEN);
        const liveLast = liveWaveSources.get(last);
        if (liveLast) { liveWaveSources.set(idx, liveLast); liveWaveSources.delete(last); }
      }
      beaconCount--; uploadWaves(); uploadBeacons(); clearSelection(); closePanel();
    }

    /* selection state & overlay draw -----------------------------------*/
    const selected=new Set(); let selIdx=-1, rectSelect=false,
          dragIdx=-1, dragGroup=false, placing=false;
    let rectStart=[0,0],rectEnd=[0,0],dragStart=[0,0],
        groupInitPos=new Map();
    function clearSelection(){selected.clear(); drawOverlay();}
    function traceBoundaryPath(pad = 0){
      const n  = Math.max(3, Math.min(128, Math.round(boundary.sides)));
      const cx = domain.w * 0.5, cy = domain.h * 0.5, R = Math.max(8, boundary.radius - pad);
      octx.beginPath();
      for (let k = 0; k < n; ++k) {
        const a = boundary.rotation + Math.PI * 2 * k / n;
        const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
        if (k === 0) octx.moveTo(x, y); else octx.lineTo(x, y);
      }
      octx.closePath();
    }
    function clipOverlayToBoundary(){
      traceBoundaryPath(0);
      octx.clip();
    }
    function drawBoundaryOverlay(){
      octx.save();
      octx.strokeStyle = 'rgba(255,255,255,0.35)';
      octx.lineWidth = 2;
      traceBoundaryPath(0);
      octx.stroke();
      octx.restore();
    }
    function positiveMod(x, m){ return ((x % m) + m) % m; }
    function drawBeaconAuras(){
      if (!alienState.beaconAuras) return;
      octx.save();
      clipOverlayToBoundary();
      const maxVisibleR = Math.hypot(domain.w, domain.h);
      for (let i = 0; i < beaconCount; ++i) {
        const o = beaconOffset(i);
        const x = beaconArr[o], y = beaconArr[o + 1];
        const freq = Math.max(0.001, Math.abs(beaconArr[o + 2]));
        const amp = Math.max(0, Math.abs(beaconArr[o + 3] * simParams.beaconScale));
        const decay = Math.max(0.001, beaconArr[o + 4]);
        const phase = beaconArr[o + 5] || 0;
        const selectedBeacon = selected.has(i) || i === selIdx;
        const lambda = Math.max(5, simParams.C / freq);
        const phasePx = positiveMod(simParams.C * simTime + phase * lambda / (Math.PI * 2), lambda);
        const core = Math.max(6, Math.min(30, 5 + Math.sqrt(amp + 1) * 1.8));

        // Core signal organ: this marks the actual force source used by the compute shader.
        const grad = octx.createRadialGradient(x, y, 1, x, y, core * 2.2);
        grad.addColorStop(0, selectedBeacon ? 'rgba(255,216,102,.48)' : 'rgba(109,252,255,.34)');
        grad.addColorStop(0.62, selectedBeacon ? 'rgba(255,216,102,.13)' : 'rgba(124,255,155,.10)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        octx.fillStyle = grad;
        octx.beginPath();
        octx.arc(x, y, core * 2.2, 0, Math.PI * 2);
        octx.fill();

        // Physics-coupled wavefronts. Same phase relation as WGSL:
        // ang = TAU * freq * (simTime - distance / C) + phase.
        for (let rr = Math.max(4, phasePx); rr < maxVisibleR; rr += lambda) {
          const falloff = 1 / Math.pow(rr + 1, decay);
          const alpha = Math.max(0.014, Math.min(selectedBeacon ? 0.50 : 0.24, amp * falloff * 0.011));
          octx.strokeStyle = `rgba(${selectedBeacon ? '255,216,102' : '109,252,255'},${alpha.toFixed(3)})`;
          octx.lineWidth = selectedBeacon ? 1.6 : 1;
          octx.beginPath();
          octx.arc(x, y, rr, 0, Math.PI * 2);
          octx.stroke();
        }
        if (beaconArr[o + WAVE_FLAG] > 0.5) {
          octx.strokeStyle = selectedBeacon ? 'rgba(255,216,102,.55)' : 'rgba(124,255,155,.28)';
          octx.setLineDash([3, 5]);
          octx.beginPath();
          octx.arc(x, y, core + 13, 0, Math.PI * 2);
          octx.stroke();
          octx.setLineDash([]);
        }
      }
      octx.restore();
    }
    function drawBeaconGridOverlay(){
      let any = false;
      for (let i = 0; i < beaconCount; ++i) if (getGrid(i)) { any = true; break; }
      if (!any) return;
      octx.save();
      clipOverlayToBoundary();
      octx.strokeStyle = 'rgba(255,255,255,0.13)';
      octx.lineWidth = 1;
      for (let i = 0; i < beaconCount; ++i) {
        if (!getGrid(i)) continue;
        const bx = beaconArr[beaconOffset(i)];
        const by = beaconArr[beaconOffset(i) + 1];
        const f = Math.max(0.001, Math.abs(beaconArr[beaconOffset(i) + 2] || 1));
        const lambda = simParams.C / f;
        if (lambda < 4) continue;
        for (let x = bx; x >= 0; x -= lambda) { octx.beginPath(); octx.moveTo(x, 0); octx.lineTo(x, domain.h); octx.stroke(); }
        for (let x = bx + lambda; x <= domain.w; x += lambda) { octx.beginPath(); octx.moveTo(x, 0); octx.lineTo(x, domain.h); octx.stroke(); }
        for (let y = by; y >= 0; y -= lambda) { octx.beginPath(); octx.moveTo(0, y); octx.lineTo(domain.w, y); octx.stroke(); }
        for (let y = by + lambda; y <= domain.h; y += lambda) { octx.beginPath(); octx.moveTo(0, y); octx.lineTo(domain.w, y); octx.stroke(); }
      }
      octx.restore();
    }
    function drawOverlay(){
      octx.clearRect(0,0,oCanvas.width,oCanvas.height);
      drawBoundaryOverlay();
      drawBeaconAuras();
      if(rectSelect){
        const x0=Math.min(rectStart[0],rectEnd[0]),
              y0=Math.min(rectStart[1],rectEnd[1]),
              w =Math.abs(rectEnd[0]-rectStart[0]),
              h =Math.abs(rectEnd[1]-rectStart[1]);
        octx.setLineDash([4,4]); octx.strokeStyle='#ff0';
        octx.strokeRect(x0,y0,w,h); octx.setLineDash([]);
      }
      for(let i=0;i<beaconCount;++i){
        const x=beaconArr[beaconOffset(i)], y=beaconArr[beaconOffset(i)+1];
        octx.strokeStyle = selected.has(i)?'#ff0':(i===selIdx?'#0ff':'#0f0');
        octx.lineWidth=2; octx.beginPath(); octx.arc(x,y,6,0,6.283); octx.stroke();
      }
      for (let i = 0; i < beaconCount; ++i) {
        if (!getGrid(i)) continue;

        const bx = beaconArr[beaconOffset(i)    ];     // centre X
        const by = beaconArr[beaconOffset(i) + 1];     // centre Y
        const f  = beaconArr[beaconOffset(i) + 2] || 1;
        const λ  = simParams.C / f;                    // pixels

        if (λ < 4) continue;                           // too fine → ignore

        octx.save();
        clipOverlayToBoundary();
        octx.strokeStyle = 'rgba(255,255,255,0.15)';
        octx.lineWidth   = 10;

        /* verticals, anchored on bx */
        for (let x = bx; x >= 0;           x -= λ) { octx.beginPath(); octx.moveTo(x,0);                 octx.lineTo(x,oCanvas.height); octx.stroke(); }
        for (let x = bx + λ; x <= oCanvas.width; x += λ) { octx.beginPath(); octx.moveTo(x,0);                 octx.lineTo(x,oCanvas.height); octx.stroke(); }

        /* horizontals, anchored on by */
        for (let y = by; y >= 0;           y -= λ) { octx.beginPath(); octx.moveTo(0,y);                 octx.lineTo(oCanvas.width,y); octx.stroke(); }
        for (let y = by + λ; y <= oCanvas.height; y += λ) { octx.beginPath(); octx.moveTo(0,y);                 octx.lineTo(oCanvas.width,y); octx.stroke(); }

        octx.restore();
      }      
    }

    /* GUI panels (single, add, group) ----------------------------------*/
    function relocateGroup(indices, mode){
      if(indices.length<2) return;
      const xs = indices.map(i=>beaconArr[i*B_STRIDE]);
      const ys = indices.map(i=>beaconArr[i*B_STRIDE+1]);
      const cx = xs.reduce((a,b)=>a+b,0)/indices.length;
      const cy = ys.reduce((a,b)=>a+b,0)/indices.length;

      switch(mode){
        case 'circle':{
          const r = Math.max(...indices.map(i=>Math.hypot(beaconArr[i*B_STRIDE]-cx,beaconArr[i*B_STRIDE+1]-cy))) || 60;
          indices.forEach((idx,k)=>{
            const ang = k*2*Math.PI/indices.length;
            updateBeaconPos(idx, cx + r*Math.cos(ang), cy + r*Math.sin(ang));
          });
        }break;
        case 'lineH':{
          const minX=Math.min(...xs), maxX=Math.max(...xs);
          const step = (maxX-minX)/(indices.length-1||1);
          const y = cy;
          indices.sort((a,b)=>beaconArr[a*B_STRIDE]-beaconArr[b*B_STRIDE])
                 .forEach((idx,k)=>{ updateBeaconPos(idx, minX + k*step, y); });
        }break;
        case 'lineV':{
          const minY=Math.min(...ys), maxY=Math.max(...ys);
          const step = (maxY-minY)/(indices.length-1||1);
          const x = cx;
          indices.sort((a,b)=>beaconArr[a*B_STRIDE+1]-beaconArr[b*B_STRIDE+1])
                 .forEach((idx,k)=>{ updateBeaconPos(idx, x, minY + k*step); });
        }break;
        case 'hex':{
          const r=60;
          const baseAng=Math.PI/6; // flat‑top hexagon
          indices.forEach((idx,k)=>{
            const ang = baseAng + k*2*Math.PI/6;
            updateBeaconPos(idx, cx + r*Math.cos(ang), cy + r*Math.sin(ang));
          });
        }break;
      }
      uploadBeacons();
      drawOverlay();
    }
    let activePanel=null;
    function closePanel(){ activePanel?.destroy(); activePanel=null; }
    function makePanel(title,x,y){
      const gui=new GUI({width:180,autoPlace:false});
      document.body.appendChild(gui.domElement);
      Object.assign(gui.domElement.style,
       {position:'absolute',left:`${x+12}px`,top:`${y+12}px`,zIndex:1000});
      gui.title(title); activePanel=gui; return gui;

    let audioCtx = null;
    const liveWaveSources = new Map();

    async function ensureAudioContext() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('Web Audio is not available in this browser.');
      audioCtx ??= new AC();
      if (audioCtx.state !== 'running') await audioCtx.resume();
      return audioCtx;
    }

    function fillWaveForBeacon(i, samples, normalize = true) {
      if (!samples?.length) return false;
      const src = samples instanceof Float32Array ? samples : Float32Array.from(samples);
      let mean = 0, peak = 1;
      if (normalize) {
        for (let k = 0; k < src.length; ++k) mean += src[k];
        mean /= src.length;
        peak = 1e-6;
        for (let k = 0; k < src.length; ++k) peak = Math.max(peak, Math.abs(src[k] - mean));
      }

      const base = i * WAVE_LEN;
      for (let j = 0; j < WAVE_LEN; ++j) {
        const p = src.length === 1 ? 0 : j * (src.length - 1) / (WAVE_LEN - 1);
        const i0 = Math.floor(p), i1 = Math.min(src.length - 1, i0 + 1);
        const t = p - i0;
        const v = (src[i0] * (1 - t) + src[i1] * t - mean) / peak;
        waveArr[base + j] = Math.max(-1, Math.min(1, v));
      }
      beaconArr[beaconOffset(i)+WAVE_FLAG] = 1;
      return true;
    }

    function writeWaveForBeacon(i, samples) {
      if (!fillWaveForBeacon(i, samples)) return;
      uploadWaves();
      uploadBeacons();
    }

    function audioBufferToMonoSamples(buffer, seconds = 8) {
      const len = Math.min(buffer.length, Math.max(1, Math.floor(buffer.sampleRate * seconds)));
      const out = new Float32Array(len);
      for (let ch = 0; ch < buffer.numberOfChannels; ++ch) {
        const data = buffer.getChannelData(ch);
        for (let i = 0; i < len; ++i) out[i] += data[i] / buffer.numberOfChannels;
      }
      return out;
    }

    function loadCSVForBeacon(i){
      const el = Object.assign(document.createElement('input'),
                               {type:'file', accept:'.csv,.txt'});
      el.click();
      el.onchange = () => el.files?.[0]?.text().then(txt => {
        const nums = txt.trim().split(/[,\s]+/).map(Number).filter(n=>!isNaN(n));
        if(nums.length===0) return;
        writeWaveForBeacon(i, nums);
      });
    }

    function loadAudioFileForBeacon(i){
      const el = Object.assign(document.createElement('input'),
                               {type:'file', accept:'audio/*,.wav,.mp3,.m4a,.ogg,.flac'});
      el.click();
      el.onchange = async () => {
        const file = el.files?.[0];
        if (!file) return;
        try {
          const ctx = await ensureAudioContext();
          const buf = await file.arrayBuffer();
          const audioBuffer = await ctx.decodeAudioData(buf);
          writeWaveForBeacon(i, audioBufferToMonoSamples(audioBuffer));
        } catch (err) {
          alert('Could not decode this audio file:\n' + err.message);
          console.error(err);
        }
      };
    }

    async function loadYouTubeForBeacon(i){
      const url = prompt('Paste a YouTube URL. Requires the local youtube-waveform-server.mjs helper.');
      if (!url) return;
      try {
        const res = await fetch(`/api/youtube/waveform?url=${encodeURIComponent(url)}&samples=${WAVE_LEN}&seconds=8`);
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        writeWaveForBeacon(i, data.samples);
      } catch (err) {
        alert('Could not load YouTube audio. Run the included helper server and open this page from http://localhost:8787.\n\n' + err.message);
        console.error(err);
      }
    }

    function stopLiveForBeacon(i){
      const src = liveWaveSources.get(i);
      if (!src) return;
      try { src.source?.disconnect(); } catch {}
      try { src.analyser?.disconnect(); } catch {}
      try { src.stream?.getTracks().forEach(t => t.stop()); } catch {}
      liveWaveSources.delete(i);
    }

    async function useMicForBeacon(i){
      stopLiveForBeacon(i);
      try {
        const ctx = await ensureAudioContext();
        const stream = await navigator.mediaDevices.getUserMedia({
          video:false,
          audio:{
            echoCancellation:false,
            noiseSuppression:false,
            autoGainControl:false
          }
        });
        const source = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.0;
        source.connect(analyser);
        liveWaveSources.set(i, { type:'mic', stream, source, analyser, data:new Float32Array(analyser.fftSize), normalize:false });
        beaconArr[beaconOffset(i)+WAVE_FLAG] = 1;
        uploadBeacons();
      } catch (err) {
        alert('Could not start microphone input:\n' + err.message);
        console.error(err);
      }
    }

    function pumpLiveAudioWaves(){
      if (liveWaveSources.size === 0) return;
      let changed = false;
      for (const [i, src] of liveWaveSources) {
        if (i >= beaconCount) continue;
        src.analyser.getFloatTimeDomainData(src.data);
        changed = fillWaveForBeacon(i, src.data, src.normalize ?? true) || changed;
      }
      if (changed) {
        uploadWaves();
        uploadBeacons();
      }
    }

    /* pointer helpers & event listeners --------------------------------*/
    canvas.addEventListener('contextmenu', e => {
      e.preventDefault();
      const [xSim, ySim] = pos(e);
      // Find nearest beacon within 12 px
      let closest = -1;
      let bestD2  = 144; // 12²
      for (let i = 0; i < beaconCount; ++i) {
        const dx = beaconArr[i * B_STRIDE]     - xSim;
        const dy = beaconArr[i * B_STRIDE + 1] - ySim;
        const d2 = dx * dx + dy * dy;
        if (d2 < bestD2) { bestD2 = d2; closest = i; }
      }

      if(selected.size>1){
        // clicking anywhere opens group panel
        openGroupPanel([...selected], e.pageX, e.pageY);
        return;
      }

      if (closest >= 0) {
        openBeaconEditor(closest, e.pageX, e.pageY);
      } else {
        openAddPanel(xSim, ySim, e.pageX, e.pageY);
      }
    });

    /* ---------------------------------------------------------------------
       Close panel on outside click -------------------------------------- */
    window.addEventListener('pointerdown', e => {
      if (!activePanel) return;
      if (activePanel.domElement.contains(e.target)) return; // click inside panel
      if (e.button === 2) return;                            // right‑click handled above
      closePanel();
    });
    
    const pos=e=>{
      const r=canvas.getBoundingClientRect();
      const sx = domain.w / Math.max(1, r.width);
      const sy = domain.h / Math.max(1, r.height);
      return [(e.clientX-r.left)*sx,(e.clientY-r.top)*sy];
    };
    /* ────────── interaction ─────────── */
    let touchHoldTimer = 0, touchHoldStart = null, touchHoldOpened = false, lastTouchTap = 0, lastTouchHit = -2;
    function cancelTouchHold(){
      if (touchHoldTimer) clearTimeout(touchHoldTimer);
      touchHoldTimer = 0;
    }
    function openContextLikeMenu(xSim, ySim, pageX, pageY, closest){
      if (selected.size > 1) openGroupPanel([...selected], pageX, pageY);
      else if (closest >= 0) openBeaconEditor(closest, pageX, pageY);
      else openAddPanel(xSim, ySim, pageX, pageY);
    }
    function scheduleTouchHold(e, x, y, hitIdx){
      if (e.pointerType !== 'touch') return;
      cancelTouchHold(); touchHoldOpened = false;
      touchHoldStart = { x, y, pageX:e.pageX, pageY:e.pageY, hitIdx };
      touchHoldTimer = setTimeout(() => {
        touchHoldOpened = true;
        rectSelect = false; dragIdx = -1; dragGroup = false;
        openContextLikeMenu(touchHoldStart.x, touchHoldStart.y, touchHoldStart.pageX, touchHoldStart.pageY, touchHoldStart.hitIdx);
        drawOverlay();
      }, 560);
    }

    canvas.addEventListener('pointerdown',e=>{
      const [x,y]=pos(e);
      const touchLike = e.pointerType === 'touch' || e.pointerType === 'pen';
      const hitRadius = touchLike ? 26 : 10;
      let hitIdx=-1;
      for(let i=0;i<beaconCount;++i){const bx=beaconArr[i*B_STRIDE],by=beaconArr[i*B_STRIDE+1];if((bx-x)**2+(by-y)**2<hitRadius*hitRadius){hitIdx=i;break;}}
      if (touchLike) {
        const now = performance.now();
        if (hitIdx >= 0 && hitIdx === lastTouchHit && now - lastTouchTap < 340) {
          cancelTouchHold(); touchHoldOpened = true;
          openContextLikeMenu(x, y, e.pageX, e.pageY, hitIdx);
          lastTouchTap = 0; lastTouchHit = -2;
          return;
        }
        lastTouchTap = now; lastTouchHit = hitIdx;
      }
      scheduleTouchHold(e, x, y, hitIdx);

      // Ctrl‑click toggles selection membership ---------------------------
      if(e.ctrlKey && hitIdx>=0){
        if(selected.has(hitIdx)) selected.delete(hitIdx); else selected.add(hitIdx);
        selIdx=-1;
        drawOverlay();
        return; // stop
      }

      dragIdx=-1; dragGroup=false;

      // BEGIN GROUP DRAG --------------------------------------------------
      if(hitIdx>=0 && selected.size>1 && selected.has(hitIdx)){
        dragGroup=true;
        dragStart=[x,y];
        groupInitPos.clear();
        selected.forEach(idx=>{
          groupInitPos.set(idx,[beaconArr[idx*B_STRIDE],beaconArr[idx*B_STRIDE+1]]);
        });
        return;
      }

      // SINGLE DRAG -------------------------------------------------------
      if(hitIdx>=0){
        dragIdx=hitIdx;
        selIdx=hitIdx;
        clearSelection();
        drawOverlay();
        return;
      }

      // Place new beacon if in placing mode ------------------------------
      if(placing && beaconCount<MAX_BEACONS){
        createBeacon(beaconCount,x,y); beaconCount++; uploadBeacons(); selIdx=beaconCount-1; clearSelection(); placing=false;
        return;
      }

      // Otherwise: begin rectangle selection -----------------------------
      if(e.button===0){
        rectSelect=true;
        rectStart=[x,y];
        rectEnd=[x,y];
        clearSelection();
        selIdx=-1;
        drawOverlay();
      }
    });

    canvas.addEventListener('pointermove', e=>{
      const [x, y] = pos(e);
      if (touchHoldTimer && touchHoldStart && e.pointerType === 'touch') {
        if (Math.hypot(x - touchHoldStart.x, y - touchHoldStart.y) > 18) cancelTouchHold();
      }
      if (dragIdx >= 0) {
        updateBeaconPos(dragIdx, x, y);
        uploadBeacons();
        drawOverlay();
      } else if(dragGroup){
        const dx=x-dragStart[0];
        const dy=y-dragStart[1];
        groupInitPos.forEach(([x0,y0],idx)=>{
          updateBeaconPos(idx,x0+dx,y0+dy);
        });
        uploadBeacons();
        drawOverlay();
      } else if(rectSelect){
        rectEnd=[x,y];
        drawOverlay();
      }
    });

    window.addEventListener('pointerup', e=>{
      cancelTouchHold();
      if (touchHoldOpened) { touchHoldOpened = false; dragIdx = -1; dragGroup = false; rectSelect = false; drawOverlay(); return; }
      dragIdx=-1;
      if(dragGroup){ dragGroup=false; groupInitPos.clear(); return; }
      if(rectSelect){
        const [x,y]=pos(e);
        rectEnd=[x,y];
        rectSelect=false;
        const x0=Math.min(rectStart[0],rectEnd[0]);
        const x1=Math.max(rectStart[0],rectEnd[0]);
        const y0=Math.min(rectStart[1],rectEnd[1]);
        const y1=Math.max(rectStart[1],rectEnd[1]);
        clearSelection();
        for(let i=0;i<beaconCount;++i){
          const bx=beaconArr[i*B_STRIDE], by=beaconArr[i*B_STRIDE+1];
          if(bx>=x0 && bx<=x1 && by>=y0 && by<=y1){ selected.add(i); }
        }
        drawOverlay();
      }
    });

    /* ────────── overlay draw ────────── */
    function drawOverlay(){
      octx.clearRect(0,0,oCanvas.width,oCanvas.height);
      drawBeaconAuras();
      drawBeaconGridOverlay();
      drawBoundaryOverlay();

      // draw selection rectangle if active
      if(rectSelect){
        const x0=Math.min(rectStart[0],rectEnd[0]);
        const y0=Math.min(rectStart[1],rectEnd[1]);
        const w=Math.abs(rectEnd[0]-rectStart[0]);
        const h=Math.abs(rectEnd[1]-rectStart[1]);
        octx.strokeStyle='#ff0';
        octx.lineWidth=1;
        octx.setLineDash([4,4]);
        octx.strokeRect(x0,y0,w,h);
        octx.setLineDash([]);
      }

      for(let i=0;i<beaconCount;++i){
        const x=beaconArr[i*B_STRIDE],y=beaconArr[i*B_STRIDE+1];
        octx.strokeStyle = selected.has(i) ? '#ff0' : (i===selIdx?'#0ff':'#0f0');
        octx.lineWidth=2;
        octx.beginPath();
        octx.arc(x,y,6,0,Math.PI*2);
        octx.stroke();
      }
    }

    drawOverlay();
    /* ******************** END OF BEACON MODULE *************************/

    /********************  SECTION 1C ─ UI CONTROLS **********************/
    function kindForLayout(mode, i, x, y) {
      if (kindCount <= 1) return 0;
      const cx = domain.w * 0.5, cy = domain.h * 0.5;
      switch (mode) {
        case 'Index bands':
          return Math.floor(i * kindCount / particleCount) % kindCount;
        case 'Horizontal bands':
          return Math.min(kindCount - 1, Math.max(0, Math.floor((y / domain.h) * kindCount)));
        case 'Radial wedges': {
          const a = (Math.atan2(y - cy, x - cx) + Math.PI * 2) % (Math.PI * 2);
          return Math.floor(a / (Math.PI * 2) * kindCount) % kindCount;
        }
        case 'Concentric rings': {
          const r = Math.hypot(x - cx, y - cy) / Math.max(1, boundary.radius);
          return Math.min(kindCount - 1, Math.floor(r * kindCount));
        }
        case 'Random':
        default:
          return Math.floor(Math.random() * kindCount);
      }
    }
    const particleOps = {
      spawnSpeed : 2.0,
      kindLayout : 'Random',
      resetParticles () {
        for (let i = 0, o = 0; i < particleCount; ++i, o += P_STRIDE) {
          const [x, y] = randomPointInBoundary();
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * particleOps.spawnSpeed;
          pInit[o] = x; pInit[o + 1] = y;
          pInit[o + 2] = Math.cos(angle) * speed;
          pInit[o + 3] = Math.sin(angle) * speed;
          pInit[o + 4] = kindForLayout(particleOps.kindLayout, i, x, y);
        }
        queue.writeBuffer(bufA, 0, pInit);
        queue.writeBuffer(bufB, 0, pInit);
      }
    };

    const runtimeGUI=new GUI();
    const simGUI = runtimeGUI.addFolder('Simulation');

    simGUI.add(simParams,'friction',0.80,1.02,0.0001).name('Velocity damping');
    simGUI.add(simParams, 'speedLimit', 0, 1000, 0.1).name('Max speed (0=off)');

    const interactionGUI = runtimeGUI.addFolder('Particle interactions');
    interactionGUI.add(simParams, 'forceScale', -5, 5, 0.001).name('Global force scale');
    interactionGUI.add(simParams, 'radiusScale', 0.01, 5, 0.001).name('Global radius scale');

    function forcePairLabel(a,b){ return `kind ${a} ← source ${b}`; }
    const pairLabels = [];
    const pairForLabel = new Map();
    for (let a = 0; a < kindCount; ++a) for (let b = 0; b < kindCount; ++b) {
      const label = forcePairLabel(a,b);
      pairLabels.push(label);
      pairForLabel.set(label, [a,b]);
    }
    const forceProxy = {
      preset : FORCE_PRESET_NAMES.includes(preset) ? preset : 'Random',
      pair   : pairLabels[0],
      mirror : false,
      radius : fData[0],

    };
    let forceRadiusCtrl, forceStrengthCtrl, forcePairCtrl, forcePresetCtrl;
    function selectedForcePair(){ return pairForLabel.get(forceProxy.pair) ?? [0,0]; }
    function refreshForceProxy(){
      const [a,b] = selectedForcePair();

      forceStrengthCtrl?.updateDisplay();
      forcePairCtrl?.updateDisplay();
      forcePresetCtrl?.updateDisplay();

      .name('Edit pair')

      .name('Pair radius')

    forceStrengthCtrl = interactionGUI.add(forceProxy, 'strength', -2.5, 2.5, 0.001)
      .name('Pair strength')
      .onChange(v => { forceProxy.strength = v; commitSelectedForce(); });
    let forceMirrorCtrl = interactionGUI.add(forceProxy, 'mirror').name('Mirror A↔B edits');

    const HEATMAP_TOOLS = ['Inspect / sample','Paint attract','Paint repel','Zero force'];
    const heatmapState = {
      visible : true,
      tool    : 'Inspect / sample',
      brushRadius : Math.max(0, Math.round(forceProxy.radius || 40)),
      brushStrength : Math.max(0, Math.abs(Number(forceProxy.strength || 0.25))),
      writeRadius : true,
      showValues : true,
      mirror : false
    };
    let heatmapPanel = null;
    let heatmapGrid = null;
    let heatmapPainting = false;
    let heatmapStatus = null;

    let heatmapStrengthNum = null;

    function heatClamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
    function fmtSigned(v, digits=3){ return `${v >= 0 ? '+' : ''}${Number(v).toFixed(digits)}`; }
    function cellValues(a,b){ const o = forceOffset(a,b); return { radius:fData[o], strength:fData[o+1] }; }
    function selectedForceValues(){ const [a,b] = selectedForcePair(); return { a, b, ...cellValues(a,b) }; }
    function toolSignedStrength(){
      const mag = Math.max(0, Number(heatmapState.brushStrength) || 0);
      if (heatmapState.tool === 'Paint attract') return mag;
      if (heatmapState.tool === 'Paint repel') return -mag;
      if (heatmapState.tool === 'Zero force') return 0;
      const cur = selectedForceValues().strength;
      return Math.sign(cur || 1) * mag;
    }
    function brushVerb(){
      if (heatmapState.tool === 'Paint attract') return 'writes ATTRACT';
      if (heatmapState.tool === 'Paint repel') return 'writes REPEL';

    function syncHeatmapToolButtons(){

    function updateHeatmapReadouts(){
      heatmapState.brushStrength = heatClamp(Number(heatmapState.brushStrength) || 0, 0, 2.5);
      heatmapState.brushRadius = heatClamp(Number(heatmapState.brushRadius) || 0, 0, 180);
      const baseSel = selectedForceValues();
      const sel = hoverRelation.active
        ? { a:hoverRelation.a, b:hoverRelation.b, ...cellValues(hoverRelation.a, hoverRelation.b) }
        : baseSel;
      const cellLabel = hoverRelation.active ? 'HOVER' : 'SELECTED';
      const signedBrush = toolSignedStrength();
      if (heatmapStrengthOut) heatmapStrengthOut.textContent = heatmapState.brushStrength.toFixed(3);
      if (heatmapRadiusOut) heatmapRadiusOut.textContent = `${heatmapState.brushRadius.toFixed(1)} px`;
      if (heatmapStrengthNum && Number(heatmapStrengthNum.value) !== heatmapState.brushStrength) heatmapStrengthNum.value = heatmapState.brushStrength.toFixed(3);
      if (heatmapRadiusNum && Number(heatmapRadiusNum.value) !== heatmapState.brushRadius) heatmapRadiusNum.value = heatmapState.brushRadius.toFixed(1);
      if (heatmapStatus) {
        heatmapStatus.innerHTML = `${cellLabel} <b>K${sel.a} ← K${sel.b}</b> &nbsp; strength <b>${fmtSigned(sel.strength,3)}</b> &nbsp; radius <b>${sel.radius.toFixed(1)}px</b>`;
      }
      if (heatmapBrushStatus) {
        const radiusWrite = heatmapState.writeRadius ? `radius <b>${heatmapState.brushRadius.toFixed(1)}px</b>` : '<b>radius unchanged</b>';
        const mirror = (heatmapState.mirror || forceProxy.mirror) ? 'MIRROR ON' : 'mirror off';
        heatmapBrushStatus.innerHTML = `BRUSH <b>${brushVerb()}</b> &nbsp; strength <b>${fmtSigned(signedBrush,3)}</b> &nbsp; ${radiusWrite} &nbsp; ${mirror}`;
      }
      syncHeatmapToolButtons();
    }
    function updateHeatmapGUI(){
      heatmapVisibleCtrl?.updateDisplay();
      heatmapToolCtrl?.updateDisplay();
      heatmapBrushStrengthCtrl?.updateDisplay();
      heatmapBrushRadiusCtrl?.updateDisplay();
      heatmapWriteRadiusCtrl?.updateDisplay();
      heatmapShowValuesCtrl?.updateDisplay();
      heatmapMirrorCtrl?.updateDisplay();
    }
    function maxForceAbs(){ return Math.max(0.001, ...Array.from({length:kindCount*kindCount}, (_,i)=>Math.abs(fData[i*2+1]))); }
    function maxForceRadius(){ return Math.max(1, ...Array.from({length:kindCount*kindCount}, (_,i)=>fData[i*2])); }
    function strengthColor(strength){
      const mag = Math.min(1, Math.abs(strength) / maxForceAbs());
      if (strength > 0) {
        return `linear-gradient(180deg, rgba(0,255,183,${0.18 + mag*0.62}), rgba(0,76,45,${0.35 + mag*0.45}))`;
      }
      if (strength < 0) {
        return `linear-gradient(180deg, rgba(255,77,125,${0.18 + mag*0.62}), rgba(80,0,28,${0.35 + mag*0.45}))`;
      }
      return 'linear-gradient(180deg, rgba(55,95,60,.42), rgba(0,20,5,.74))';
    }
    function selectForcePair(a,b, sampleBrush=false){
      selectedRelation.a = a;
      selectedRelation.b = b;
      selectedRelation.active = true;
      forceProxy.pair = forcePairLabel(a,b);
      refreshForceProxy();
      if (sampleBrush) {
        const v = cellValues(a,b);
        heatmapState.brushRadius = v.radius;
        heatmapState.brushStrength = Math.abs(v.strength);
      }
      updateHeatmapReadouts();
      updateHeatmapGUI();
      updateAlienHud();
      scheduleForceHeatmapDraw();
    }
    function applyHeatmapBrush(a,b){
      selectForcePair(a,b, false);
      if (heatmapState.tool === 'Inspect / sample') return;
      const v = cellValues(a,b);
      let radius = heatmapState.writeRadius ? heatmapState.brushRadius : v.radius;
      let strength = v.strength;
      if (heatmapState.tool === 'Paint attract') strength = Math.abs(heatmapState.brushStrength || 0);
      else if (heatmapState.tool === 'Paint repel') strength = -Math.abs(heatmapState.brushStrength || 0);
      else if (heatmapState.tool === 'Zero force') strength = 0;
      setForce(a,b,radius,strength,heatmapState.mirror || forceProxy.mirror);
      refreshForceProxy();
      updateHeatmapReadouts();
    }
    function nudgeHeatmapCell(a,b,e){
      e.preventDefault();
      const dir = e.deltaY < 0 ? 1 : -1;
      const v = cellValues(a,b);
      let radius = v.radius;
      let strength = v.strength;
      if (e.shiftKey) {
        const step = e.altKey ? 0.25 : (e.ctrlKey || e.metaKey ? 10 : 2);
        radius = heatClamp(radius + dir * step, 0, 180);
      } else {
        const step = e.altKey ? 0.005 : (e.ctrlKey || e.metaKey ? 0.10 : 0.025);
        strength = heatClamp(strength + dir * step, -2.5, 2.5);
      }
      setForce(a,b,radius,strength,heatmapState.mirror || forceProxy.mirror);
      forceProxy.pair = forcePairLabel(a,b);
      refreshForceProxy();
      heatmapState.brushRadius = radius;
      heatmapState.brushStrength = Math.abs(strength);
      updateHeatmapReadouts();
      updateHeatmapGUI();
    }
    function syncHeatmapPanelDisplay(){
      if (!heatmapPanel) return;

    }
    function makeForceHeatmapPanel(){

        <div class="force-legend">

          <span class="chip"><span class="swatch" style="background:linear-gradient(90deg,#00ffb7,#004c2d)"></span>positive = attract</span>

      document.body.appendChild(heatmapPanel);
      heatmapGrid = heatmapPanel.querySelector('[data-grid]');

      heatmapStrengthOut = heatmapPanel.querySelector('[data-strength-out]');

      const strength = heatmapPanel.querySelector('[data-strength]');
      const radius = heatmapPanel.querySelector('[data-radius]');
      heatmapStrengthNum = heatmapPanel.querySelector('[data-strength-num]');
      heatmapRadiusNum = heatmapPanel.querySelector('[data-radius-num]');

      const mirror = heatmapPanel.querySelector('[data-mirror]');
      const numbers = heatmapPanel.querySelector('[data-numbers]');
      strength.value = heatmapState.brushStrength;

      heatmapPanel.querySelectorAll('[data-tool]').forEach(btn => {

      const titlebar = heatmapPanel.querySelector('.force-titlebar');

    drawForceHeatmap = function(){
      if (!heatmapGrid) return;
      heatmapGrid.style.gridTemplateColumns = `54px repeat(${kindCount}, 76px)`;

      const corner = document.createElement('div');

    function mutateForces(amount=0.085){
      for (let a = 0; a < kindCount; ++a) for (let b = 0; b < kindCount; ++b) {
        const o = forceOffset(a,b);
        fData[o] = heatClamp(fData[o] + (Math.random()*2-1)*8, 4, 180);
        fData[o + 1] = heatClamp(fData[o + 1] + (Math.random()*2-1)*amount, -2.5, 2.5);
      }
      uploadForces(); refreshForceProxy(); updateHeatmapReadouts(); updateAllGUIDisplays(); updateAlienHud();
    }
    function stabilizeOrganism(){
      symmetrizeForces();
      simParams.forceScale = Math.max(-1.25, Math.min(1.25, simParams.forceScale * 0.72));
      simParams.radiusScale = Math.max(0.35, Math.min(1.8, simParams.radiusScale));
      simParams.friction = Math.min(simParams.friction, 0.993);
      if (simParams.speedLimit === 0 || simParams.speedLimit > 220) simParams.speedLimit = 220;
      refreshForceProxy(); updateHeatmapReadouts(); updateAllGUIDisplays(); updateAlienHud();
    }
    function matrixSymmetryScore(){
      if (kindCount <= 1) return 1;
      let diff = 0, total = 1e-6;
      for (let a = 0; a < kindCount; ++a) for (let b = a + 1; b < kindCount; ++b) {
        const ab = forceOffset(a,b), ba = forceOffset(b,a);
        diff += Math.abs(fData[ab] - fData[ba]) / 180 + Math.abs(fData[ab + 1] - fData[ba + 1]) / 2.5;
        total += 2;
      }
      return Math.max(0, Math.min(1, 1 - diff / total));
    }
    function chooseShipHint(){
      const sym = matrixSymmetryScore();
      const rel = hoverRelation.active ? hoverRelation : selectedForceValues();
      if (fps < 32) return '<b>THERMAL PRESSURE:</b> lower particle count, disable glow, or switch to Pocket profile next launch.';
      if (beaconCount === 0) return '<b>SEED A VOICE:</b> right-click desktop or long-press touch to add a beacon.';
      if (Math.abs(simParams.beaconScale) < 1e-4) return '<b>BEACON FIELD MUTED:</b> raise Beacon globals → Beacon amp scale to reconnect wave pressure to the organism.';
      if (liveWaveSources.size > 0) return '<b>BIOAUDIO LINK:</b> microphone waveform is feeding beacon pressure in real time.';
      if (heatmapState.visible && selectedRelation.active) return `<b>RELATION PROBE:</b> K${rel.a} is the moving kind. K${rel.b} is the source kind. Wheel cells to tune strength; Shift+wheel tunes radius.`;
      if (heatmapState.visible) return '<b>RELATION PROBE:</b> hover or tap a matrix cell to spotlight which kinds it connects.';
      if (renderParams.trails) return '<b>VISUAL ECHO:</b> trails are only rendering memory; they do not alter the physics.';
      if (sym > 0.86) return '<b>SYMMETRY HIGH:</b> stable crystals and orbiting tissues are more likely. Mutate to make it stranger.';
      return '<b>COCKPIT READY:</b> use the morph membrane for broad steering; open the matrix for surgical edits.';
    }

            speedLimit  : 'Velocity clamp; 0 disables clamping.'
          },
          renderParams  : 'Visual mode controls: trails, trailFade, brightness/gain, and toggleable CSS glow.',
          boundary      : 'Regular n-sided polygon: { sides, radius, rotation, bounce, keepBeaconsInside }. Use sides=128 for a circle-like boundary.',
          alienUI      : 'Cockpit/hints/morph membrane visibility and behavior flags.',
          forces        : '[radius, strength] pairs for every kind × kind interaction.',
          beaconCount   : 'Number of active beacons in `beacons[]`.',
          beacons       : 'Flattened array of beacons: [x, y, freq, amp, decay, phase, grid, useWave] …',
          waves         : `Waveform samples per beacon (${WAVE_LEN} each)`
        };
        const json=JSON.stringify(data,null,2);
        try{await navigator.clipboard.writeText(json);
            alert('Save copied to clipboard 👍');}
        catch{console.log(json); alert('Clipboard failed – see console.');}
      }
    };
    runtimeGUI.add(fileOps,'save').name('💾 Save');
    runtimeGUI.add(fileOps,'exportJSON').name('📋 Export');

    /********************  SECTION 1E ─ SIM LOOP *************************/
    const ctx=canvas.getContext('webgpu');
    ctx.configure({device,format:presentationFormat, alphaMode:'opaque'});
    const renderUBuf=device.createBuffer({size:16, usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
    const renderBG=device.createBindGroup({layout:renderUBGLayout,
      entries:[{binding:0,resource:{buffer:renderUBuf}}]});
    const fadeUBuf=device.createBuffer({size:16, usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
    const presentUBuf=device.createBuffer({size:16, usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
    const screenSampler=device.createSampler({magFilter:'linear', minFilter:'linear'});
    function makeTrailTexture(){
      return device.createTexture({
        size:[domain.w, domain.h], format:presentationFormat,
        usage:GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST
      });
    }
    const trailTextures=[makeTrailTexture(), makeTrailTexture()];
    const trailViews=trailTextures.map(t => t.createView());
    const screenBGs = { fade:[], present:[] };
    for (let i = 0; i < 2; ++i) {
      screenBGs.fade[i] = device.createBindGroup({layout:screenBGLayout, entries:[
        {binding:0,resource:trailViews[i]}, {binding:1,resource:screenSampler}, {binding:2,resource:{buffer:fadeUBuf}}
      ]});
      screenBGs.present[i] = device.createBindGroup({layout:screenBGLayout, entries:[
        {binding:0,resource:trailViews[i]}, {binding:1,resource:screenSampler}, {binding:2,resource:{buffer:presentUBuf}}
      ]});
    }
    function clearTrailHistory(){
      const enc=device.createCommandEncoder();
      for (const view of trailViews) {
        const pass=enc.beginRenderPass({colorAttachments:[{view,loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});
        pass.end();
      }
      queue.submit([enc.finish()]);
      trailReadIndex = 0;
    }
    function updateCanvasGlow(){
      canvas.style.filter = renderParams.glow
        ? `blur(${renderParams.glowBlur}px) brightness(${renderParams.glowBrightness}) saturate(${renderParams.glowSaturation})`
        : 'none';
    }
    const compBG_A=device.createBindGroup({layout:cBGLayout,
      entries:[{binding:0,resource:{buffer:bufA}},
               {binding:1,resource:{buffer:bufB}},
               {binding:2,resource:{buffer:fBuf}}]});
    const compBG_B=device.createBindGroup({layout:cBGLayout,
      entries:[{binding:0,resource:{buffer:bufB}},
               {binding:1,resource:{buffer:bufA}},
               {binding:2,resource:{buffer:fBuf}}]});
    const simBG=device.createBindGroup({layout:uBGLayout,
      entries:[{binding:0,resource:{buffer:uBuf}}]});
    const beaconBG=device.createBindGroup({layout:bBGLayout,
      entries:[{binding:0,resource:{buffer:beaconBuf}}]});
    const waveBG = device.createBindGroup({layout:waveBGLayout,
      entries:[{binding:0,resource:{buffer:waveBuf}}]});
    const rBG_A=device.createBindGroup({layout:rBGLayout,
      entries:[{binding:0,resource:{buffer:bufA}}]});
    const rBG_B=device.createBindGroup({layout:rBGLayout,
      entries:[{binding:0,resource:{buffer:bufB}}]});

    let flip=false;
    let trailReadIndex=0;
    clearTrailHistory();
    function frame(){
      if (!alienState.paused) {
        pumpLiveAudioWaves();
        simTime+=simParams.dt; updUniform(beaconCount);
      }
      const relA = hoverRelation.active ? hoverRelation.a : selectedRelation.a;
      const relB = hoverRelation.active ? hoverRelation.b : selectedRelation.b;
      const relActive = (alienState.relationshipSpotlight && hoverRelation.active) ? 1 : 0;
      queue.writeBuffer(renderUBuf,0,new Float32Array([
        renderParams.trails ? renderParams.trailParticleGain : renderParams.pointBrightness,
        relA, relB, relActive
      ]));
      queue.writeBuffer(fadeUBuf,0,new Float32Array([renderParams.trailFade,0,0,0]));
      queue.writeBuffer(presentUBuf,0,new Float32Array([renderParams.trailOutputGain,0,0,0]));
      const enc=device.createCommandEncoder();

      if (!alienState.paused) {
        const cp=enc.beginComputePass();
        cp.setPipeline(compPipe);
        cp.setBindGroup(0,flip?compBG_B:compBG_A);
        cp.setBindGroup(1,simBG);
        cp.setBindGroup(2,beaconBG);
        cp.setBindGroup(3,waveBG);
        cp.dispatchWorkgroups(Math.ceil(particleCount/256));
        cp.end();
      }

      const particleBG = alienState.paused ? (flip ? rBG_B : rBG_A) : (flip ? rBG_A : rBG_B);
      if (renderParams.trails) {
        const src = trailReadIndex;
        const dst = 1 - src;
        const fadePass=enc.beginRenderPass({colorAttachments:[{
          view:trailViews[dst], loadOp:'clear', storeOp:'store', clearValue:{r:0,g:0,b:0,a:1}}]});
        fadePass.setPipeline(screenPipe);
        fadePass.setBindGroup(0,screenBGs.fade[src]);
        fadePass.draw(3);
        fadePass.end();

        const trailPass=enc.beginRenderPass({colorAttachments:[{
          view:trailViews[dst], loadOp:'load', storeOp:'store'}]});
        trailPass.setPipeline(rPipeAdd);
        trailPass.setBindGroup(0,particleBG);
        trailPass.setBindGroup(1,renderBG);
        trailPass.draw(particleCount);
        trailPass.end();

        const presentPass=enc.beginRenderPass({colorAttachments:[{
          view:ctx.getCurrentTexture().createView(), loadOp:'clear', storeOp:'store', clearValue:{r:0,g:0,b:0,a:1}}]});
        presentPass.setPipeline(screenPipe);
        presentPass.setBindGroup(0,screenBGs.present[dst]);
        presentPass.draw(3);
        presentPass.end();
        trailReadIndex = dst;
      } else {
        const rp=enc.beginRenderPass({colorAttachments:[{
          view:ctx.getCurrentTexture().createView(),
          loadOp:'clear',storeOp:'store',clearValue:{r:0,g:0,b:0,a:1}}]});
        rp.setPipeline(rPipe);
        rp.setBindGroup(0,particleBG);
        rp.setBindGroup(1,renderBG);
        rp.draw(particleCount); rp.end();
      }

      queue.submit([enc.finish()]);
      drawOverlay();
      updateAlienHud();
      if (!alienState.paused) flip=!flip;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    /* ****************************************************************** */
  } //  ← end startSim
  </script>
</body>
